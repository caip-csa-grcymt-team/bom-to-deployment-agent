[project]
name = "gsis-copilot-cli"
version = "1.0.0"
description = "MCP servers and Copilot CLI integration for GSIS infrastructure provisioning"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "azure-identity>=1.19",
    "openpyxl>=3.1",
    "pydantic>=2.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
